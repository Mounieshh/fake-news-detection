<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detector</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
    <div class="nav-logo">FND</div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/about">About This Project</a></li>
      <li><a href="https://github.com/Mounieshh/fake-news-detection" target="_blank">GitHub</a></li>
    </ul>
  </nav>

  <div class="bg-glow"></div>

  <div class="container">
    <!-- Hero Section -->
    <header class="hero-section">
      <h1 class="hero-title">
        FakeNews<br>
        <span class="hero-accent">Detector</span>
      </h1>
      <p class="hero-subtitle">
        Verify news authenticity instantly. Paste text or a URL to analyze credibility using models.
      </p>
    </header>

    <!-- Interaction Card -->
    <main class="card-section">
      <div class="card">
        <!-- Segmented Control Tabs -->
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('text')">Text</button>
          <button class="tab-btn" onclick="switchTab('url')">URL</button>
          <button class="tab-btn" onclick="switchTab('image')">Image</button>
        </div>

        <!-- Input Container -->
        <div id="input-container">
          <!-- Text Input (Active by default) -->
          <div id="text-tab" class="tab-content active">
            <div class="input-group">
              <textarea id="text-input" placeholder="Start typing or paste news content..."></textarea>
            </div>
          </div>

          <!-- URL Input -->
          <div id="url-tab" class="tab-content" style="display: none;">
            <div class="input-group">
              <input type="url" id="url-input" placeholder="https://example.com/article">
            </div>
          </div>

          <!-- Image Input -->
          <div id="image-tab" class="tab-content" style="display: none;">
            <div class="input-group">
              <input type="file" id="image-input" accept="image/*">
            </div>
            <div class="input-group">
              <textarea id="image-text-input" placeholder="Optional context text for image analysis..." style="min-height: 80px;"></textarea>
            </div>
          </div>
        </div>

        <!-- Action Button -->
        <button id="analyze-btn" class="analyze-btn" onclick="analyzeContent()">
          Analyze Content
        </button>

        <!-- Dynamic Result Area -->
        <div id="result-area" class="result-box" style="display: none;">
          <div class="result-header">
            <span id="prediction-text" class="prediction-value">REAL</span>
          </div>

          <div class="confidence-bg">
            <div id="confidence-bar" class="confidence-fill" style="width: 0%"></div>
          </div>

          <p id="explanation" class="explanation-text">
            Our AI has analyzed the content and provided a prediction.
          </p>

          
        </div>
      </div>
    </main>

    <footer class="footer">
      <button id="theme-toggle" class="theme-switch" aria-label="Toggle Theme">
        <span id="theme-icon">🌙</span> Dark Mode
      </button>
    </footer>
  </div>

  <script src="/static/js/script.js"></script>
</body>

</html>
